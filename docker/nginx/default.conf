server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 開発中（npm run dev）のCSS/JSと自動更新(WebSocket)を node コンテナの Vite へ中継する。
    # ページと同じURLで配信することで、ngrok 経由やスマホからでも読み込めるようにする。
    # （node が止まっていても nginx が起動できるよう、宛先は実行時に解決する）
    location ~ ^/(@vite|@react-refresh|@id|@fs|resources|node_modules|vite-hmr)(/|$) {
        resolver 127.0.0.11 valid=10s;
        set $vite http://node:5173;
        proxy_pass $vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
